name: Release Check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Optional exact release tag, such as v2.0.0
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Server~/package-lock.json
      - name: Install Node runtime dependencies
        run: npm ci --prefix Server~ --ignore-scripts
      - name: Run Node tests
        run: node --test Server~/test/*.test.js
      - name: Verify release metadata and package contents
        env:
          RELEASE_TAG: ${{ inputs.releaseTag }}
        run: node Tools~/Release/verify-release.mjs
      - name: Inspect package archive
        run: npm pack --dry-run --json --ignore-scripts .
